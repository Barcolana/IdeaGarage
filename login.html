<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - IdeaGarage</title>
    <link rel="stylesheet" href="style.css"> <!-- Collega il CSS -->
</head>
<body>
    <div class="container">
        <h2>Accedi a IdeaGarage</h2>
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="login">Accedi</button>
        </form>

        <p>Non hai un account? <a href="register.html">Registrati</a></p>
    </div>

    <script src="script.js"></script> <!-- Collega il JS -->
</body>
</html>
